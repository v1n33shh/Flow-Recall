<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;}</style></head>
<body>
<div style="position: relative; width: 1024px; height: 500px; background: #050505; overflow: hidden; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;">

  <div style="position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.045) 1px, transparent 1px); background-size: 40px 40px; -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 68%); mask-image: radial-gradient(ellipse at center, black 25%, transparent 68%);"></div>

  <div style="position: absolute; left: 50%; top: 50%; width: 680px; height: 680px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.04) 42%, transparent 72%);"></div>

  <div style="position: relative; height: 100%; display: flex; align-items: center; justify-content: center; gap: 48px;">

    <div style="width: 148px; height: 148px; border-radius: 34px; background: linear-gradient(155deg, #131313, #0a0a0a); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 14px 34px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="72" height="72" viewBox="0 0 32 32" aria-label="FlowRecall">
        <defs>
          <linearGradient id="cSheen" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFFFFF" />
            <stop offset="1" stop-color="#E4E4E4" />
          </linearGradient>
        </defs>
        <path
          d="M9,6 L24,6 L24,13 L14.5,13 L14.5,27 L11.75,21.5 L9,27 Z"
          fill="url(#cSheen)"
        />
      </svg>
    </div>

    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px;">
      <div style="font-size: 84px; font-weight: 700; letter-spacing: -0.025em; color: #fafafa; line-height: 1;">FlowRecall</div>
      <div style="font-size: 24px; font-weight: 500; letter-spacing: 0.08em; color: #a3a3a3; text-transform: uppercase;">AI Flashcards. Active Recall.</div>
    </div>

  </div>

</div>
</body>
</html>
